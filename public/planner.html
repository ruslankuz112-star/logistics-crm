<style>
.planner-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.planner-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.planner-card h3{font-size:14px;color:var(--accent);text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px}
.planner-field{margin-bottom:14px}
.planner-field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:700;text-transform:uppercase}
.planner-field select,.planner-field input{width:100%;background:var(--bg2,#0f1720);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:11px 13px;outline:none;font-family:inherit;font-size:14px}
.planner-field select:focus,.planner-field input:focus{border-color:var(--accent)}
.terminal-card{background:var(--bg2,#0f1720);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
.terminal-card .tc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:10px}
.terminal-card .tc-name{font-size:15px;font-weight:800;color:var(--text)}
.terminal-card .tc-code{font-size:11px;color:var(--muted);font-family:monospace}
.terminal-card .tc-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.terminal-card .tc-row:last-child{border-bottom:none}
.terminal-card .tc-row .k{color:var(--muted)}
.terminal-card .tc-row .v{font-weight:700;text-align:right}
.doc-required{display:inline-flex;align-items:center;gap:6px;background:rgba(239,91,91,.12);color:var(--red);border:1px solid rgba(239,91,91,.3);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;margin-top:10px}
.port-load{display:flex;align-items:center;gap:10px;padding:12px;background:var(--bg2,#0f1720);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.port-load .pl-name{flex:1;font-weight:700;font-size:13px}
.port-load .pl-bar{width:100px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.port-load .pl-fill{height:100%;border-radius:4px;transition:width .4s}
.port-load .pl-pct{font-size:12px;font-weight:800;min-width:42px;text-align:right}
.route-summary{background:rgba(78,168,222,.08);border:1px solid rgba(78,168,222,.25);border-radius:12px;padding:18px;margin-top:16px}
.route-summary .rs-title{font-size:12px;color:#4ea8de;text-transform:uppercase;letter-spacing:.8px;font-weight:800;margin-bottom:10px}
.route-summary .rs-line{font-size:14px;margin-bottom:6px}
.route-summary .rs-line b{color:var(--accent)}
</style>

<div class="card">
  <div class="card-head">
    <div>
      <h3>🗺️ Планировщик маршрутов доставки</h3>
      <div style="color:var(--muted);font-size:12.5px;margin-top:4px">Подбор ЖД-терминала, порта и проверка документов</div>
    </div>
  </div>

  <div class="planner-grid">
    <div class="planner-card">
      <h3>1 · Параметры отправки</h3>
      <div class="planner-field">
        <label>Город отправления</label>
        <select id="pl-from" onchange="updatePlanner()">
          <option value="voronezh">Воронеж (элеватор)</option>
          <option value="tambov">Тамбов</option>
          <option value="lipetsk">Липецк</option>
          <option value="kursk">Курск</option>
          <option value="belgorod">Белгород</option>
        </select>
      </div>
      <div class="planner-field">
        <label>Вид транспорта</label>
        <select id="pl-mode" onchange="updatePlanner()">
          <option value="rail">Железная дорога</option>
          <option value="auto">Автотранспорт</option>
        </select>
      </div>
      <div class="planner-field">
        <label>Конечная точка доставки</label>
        <select id="pl-dest" onchange="updatePlanner()">
          <option value="murmansk">Порт Мурманск (ММТП)</option>
          <option value="lavna">Терминал Лавна (Мурманск)</option>
          <option value="spb">Большой порт Санкт-Петербург</option>
          <option value="novorossiysk">Порт Новороссийск</option>
          <option value="vladivostok">Порт Владивосток (ВМТП)</option>
        </select>
      </div>
      <div class="planner-field">
        <label>Тип груза</label>
        <select id="pl-cargo" onchange="updatePlanner()">
          <option value="grain">Зерно (навалом)</option>
          <option value="containers">Зерно в контейнерах 20′</option>
          <option value="fertilizer">Удобрения</option>
          <option value="coal">Уголь</option>
        </select>
      </div>
      <div class="planner-field">
        <label>Объём (тонн)</label>
        <input id="pl-volume" type="number" value="1000000" step="10000" onchange="updatePlanner()">
      </div>
      <button class="btn btn-primary" style="width:100%;margin-top:6px" onclick="updatePlanner()">
        🔄 Рассчитать маршрут
      </button>
    </div>

    <div class="planner-card">
      <h3>2 · Результат подбора</h3>
      <div id="planner-result">
        <div style="color:var(--muted);font-size:13px;text-align:center;padding:30px 0">
          Заполните параметры слева и нажмите «Рассчитать»
        </div>
      </div>
    </div>
  </div>

  <div class="planner-card" style="margin-top:20px">
    <h3>3 · Загрузка портов в реальном времени</h3>
    <div style="color:var(--muted);font-size:12px;margin-bottom:14px">
      Источник: AIS-данные · обновляется каждые 30 секунд
    </div>
    <div id="port-loads"></div>
  </div>
</div>
