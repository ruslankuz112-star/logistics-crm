<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LogiCRM</title>
<style>
:root{--bg:#0a1017;--panel:#141f2b;--panel2:#1a2735;--line:#26384a;--text:#e8eef5;
--muted:#8296aa;--accent:#f5a623;--blue:#4ea8de;--green:#3ecf8e;--red:#ef5b5b;--purple:#9b8cf5;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
font-size:14px;line-height:1.55;height:100vh;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:14px}
input{font-family:inherit;font-size:14px}

.login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
background:linear-gradient(135deg,#0a1017,#101a26);z-index:100}
.login-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:40px;
width:100%;max-width:400px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.login-box .logo{width:56px;height:56px;border-radius:14px;
background:linear-gradient(135deg,var(--accent),#f37d1a);display:flex;align-items:center;
justify-content:center;font-size:28px;margin:0 auto 20px}
.login-box h1{text-align:center;font-size:22px;margin-bottom:6px}
.login-box .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:26px}
.login-box label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:6px;
font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.login-box input{width:100%;background:var(--bg2,#0f1720);border:1px solid var(--line);
color:var(--text);border-radius:9px;padding:12px 14px;outline:none;margin-bottom:14px}
.login-box input:focus{border-color:var(--accent)}
.login-box .btn-primary{width:100%;padding:12px;border-radius:9px;background:var(--accent);
color:#111;font-weight:800;margin-top:8px}
.login-box .btn-primary:hover{background:#ffb733}
.login-box .err{color:var(--red);font-size:12.5px;text-align:center;min-height:18px;margin-top:10px}
.login-box .toggle{text-align:center;margin-top:18px;color:var(--muted);font-size:13px}
.login-box .toggle a{color:var(--accent);cursor:pointer;font-weight:700}

.app{display:none;height:100vh}
.app.on{display:flex}
.sidebar{width:230px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
.sb-head{padding:20px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;font-weight:800}
.sb-head .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#f37d1a);
display:flex;align-items:center;justify-content:center;font-size:17px;color:#111}
.nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;
color:var(--muted);font-weight:600;cursor:pointer;margin-bottom:2px;font-size:13.5px}
.nav-item:hover{background:var(--panel2);color:var(--text)}
.nav-item.active{background:var(--panel2);color:var(--text);position:relative}
.nav-item.active::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
width:3px;height:20px;background:var(--accent);border-radius:0 3px 3px 0}
.sb-foot{padding:12px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;font-size:12.5px}
.sb-foot .av{width:30px;height:30px;border-radius:50%;
background:linear-gradient(135deg,var(--purple),var(--blue));display:flex;align-items:center;
justify-content:center;font-weight:800;font-size:11px;color:#fff}
.sb-foot .out{margin-left:auto;color:var(--muted);cursor:pointer;font-size:16px}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:60px;border-bottom:1px solid var(--line);padding:0 22px;display:flex;align-items:center;background:var(--panel)}
.topbar h2{font-size:16px}
.topbar .actions{margin-left:auto;display:flex;gap:8px}
.content{flex:1;overflow-y:auto;padding:22px}

.btn{padding:8px 15px;border-radius:8px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:7px}
.btn-primary{background:var(--accent);color:#111}
.btn-primary:hover{background:#ffb733}
.btn-ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}
.card-head h3{font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;top:0;left:0;width:100%;height:3px;background:var(--accent)}
.kpi.b::before{background:var(--blue)}.kpi.g::before{background:var(--green)}.kpi.p::before{background:var(--purple)}
.kpi .lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;font-weight:700}
.kpi .val{font-size:23px;font-weight:800;margin:7px 0 2px}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;padding:9px 10px;color:var(--muted);font-size:10.5px;
text-transform:uppercase;letter-spacing:.5px;font-weight:700;border-bottom:1px solid var(--line)}
table.tbl td{padding:11px 10px;border-bottom:1px solid var(--line)}
table.tbl tbody tr:hover{background:rgba(255,255,255,.02)}
.t-right{text-align:right}

.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.tag.amber{background:rgba(245,166,35,.14);color:var(--accent)}
.tag.blue{background:rgba(78,168,222,.14);color:var(--blue)}
.tag.green{background:rgba(62,207,142,.14);color:var(--green)}
.tag.gray{background:rgba(130,150,170,.14);color:var(--muted)}

.chat{display:flex;height:calc(100vh - 130px);gap:16px}
.channels{width:200px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.chan{padding:8px 11px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer;font-size:13px;margin-bottom:2px}
.chan:hover{background:var(--panel2);color:var(--text)}
.chan.active{background:var(--panel2);color:var(--text)}
.chat-main{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column}
.chat-head{padding:14px 20px;border-bottom:1px solid var(--line);font-weight:800}
.chat-body{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:11px;max-width:85%}
.msg.own{align-self:flex-end;flex-direction:row-reverse}
.msg .av{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;
justify-content:center;font-weight:800;font-size:12px;color:#fff;background:var(--purple)}
.msg .bubble{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 13px;font-size:13.5px}
.msg.own .bubble{background:rgba(78,168,222,.12);border-color:rgba(78,168,222,.25)}
.msg .meta{font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:700}
.chat-input{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px}
.chat-input input{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text);
border-radius:10px;padding:11px 14px;outline:none}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-bg.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.modal-head h3{font-size:15px}
.modal-body{padding:22px}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:700;text-transform:uppercase}
.field input,.field textarea,.field select{width:100%;background:var(--panel2);border:1px solid var(--line);
color:var(--text);border-radius:9px;padding:10px 12px;outline:none;font-family:inherit}
.field textarea{resize:vertical;min-height:80px}

.toasts{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:10px;z-index:2000}
.toast{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);
border-radius:10px;padding:12px 18px;font-size:13px;font-weight:600;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.toast.g{border-left-color:var(--green)}
.toast.r{border-left-color:var(--red)}
</style>
</head>
<body>

<div class="login" id="login">
  <div class="login-box">
    <div class="logo">🚛</div>
    <h1>LogiCRM</h1>
    <p class="sub">Воронеж — Мурманск — Турция</p>
    <label>Email</label>
    <input id="f-email" type="email" placeholder="you@example.com">
    <label>Пароль</label>
    <input id="f-pass" type="password" placeholder="••••••••">
    <button class="btn-primary" onclick="doLogin()">Войти</button>
    <div class="err" id="login-err"></div>
    <div class="toggle">Нет аккаунта? <a onclick="doRegister()">Зарегистрироваться</a></div>
  </div>
</div>

<div class="app" id="app">
  <aside class="sidebar">
    <div class="sb-head"><div class="logo">🚛</div><div>LogiCRM</div></div>
    <nav class="nav">
      <div class="nav-item" data-view="maritime"><span>🚢</span> Морской транспорт</div>
      <div class="nav-item active" data-view="dashboard"><span>📊</span> Дашборд</div>
      <div class="nav-item" data-view="shipments"><span>📦</span> Партии</div>
      <div class="nav-item" data-view="tasks"><span>✅</span> Задачи</div>
      <div class="nav-item" data-view="chat"><span>💬</span> Чат</div>
      <div class="nav-item" data-view="planner"><span>🗺️</span> Планировщик</div>
    </nav>
    <div class="sb-foot">
      <div class="av" id="u-av">?</div>
      <div><div id="u-name" style="font-weight:700">...</div>
      <div id="u-role" style="color:var(--muted);font-size:11px">...</div></div>
      <span class="out" onclick="doLogout()" title="Выйти">⎋</span>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <h2 id="pg-title">Дашборд</h2>
      <div class="actions"><button class="btn btn-ghost" onclick="reload()">↻ Обновить</button></div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-head"><h3 id="m-title">Форма</h3>
    <span style="cursor:pointer;font-size:20px" onclick="closeModal()">×</span></div>
    <div class="modal-body" id="m-body"></div>
    <div class="modal-foot" id="m-foot"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
const API = {
  base: '/api',
  token: localStorage.getItem('crm_token') || null,
  setToken(t){ this.token=t; t?localStorage.setItem('crm_token',t):localStorage.removeItem('crm_token'); },
  async req(method, path, body){
    const headers = { 'Content-Type':'application/json' };
    if (this.token) headers['Authorization'] = 'Bearer ' + this.token;
    const res = await fetch(this.base + path, { method, headers, body: body?JSON.stringify(body):undefined });
    if (res.status === 401) { this.setToken(null); showLogin(); throw new Error('Unauthorized'); }
    const data = await res.json().catch(()=>({}));
    if (!res.ok) throw new Error(data.error || 'API error');
    return data;
  },
  login:(e,p)=>API.req('POST','/auth/login',{email:e,password:p}),
  register:(e,p,n)=>API.req('POST','/auth/register',{email:e,password:p,name:n}),
  me:()=>API.req('GET','/auth/me'),
  shipments:(s)=>API.req('GET','/shipments'+(s&&s!=='all'?'?status='+encodeURIComponent(s):'')),
  createShipment:(d)=>API.req('POST','/shipments',d),
  updateShipment:(id,d)=>API.req('PATCH','/shipments/'+id,d),
  deleteShipment:(id)=>API.req('DELETE','/shipments/'+id),
  tasks:()=>API.req('GET','/tasks'),
  createTask:(d)=>API.req('POST','/tasks',d),
  updateTask:(id,d)=>API.req('PATCH','/tasks/'+id,d),
  deleteTask:(id)=>API.req('DELETE','/tasks/'+id),
  chat:(ch)=>API.req('GET','/chat/'+ch),
  sendMsg:(ch,text)=>API.req('POST','/chat/'+ch,{text}),
  activity:()=>API.req('GET','/activity')
};

let USER=null, VIEW='dashboard', FILTER='all', CHANNEL='general';
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => new Intl.NumberFormat('ru-RU').format(n||0);
const fmtDT = t => new Date(t).toLocaleString('ru-RU',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const initials = n => (n||'?').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const SC = {'Закупка':'#f5a623','Погрузка':'#4ea8de','В пути':'#9b8cf5','В порту':'#f37d1a','В море':'#3ecf8e','Доставлено':'#3ecf8e','Планируется':'#8296aa'};

function toast(m,t=''){const el=document.createElement('div');el.className='toast '+t;el.textContent=m;
$('#toasts').appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300);},3000);}
const statusTag = s => `<span class="tag" style="background:${(SC[s]||'#8296aa')}22;color:${SC[s]||'#8296aa'}">${esc(s)}</span>`;

async function doLogin(){
  const e=$('#f-email').value.trim(), p=$('#f-pass').value;
  $('#login-err').textContent='';
  try { const r=await API.login(e,p); API.setToken(r.token); USER=r.user; enterApp(); }
  catch(err){ $('#login-err').textContent=err.message; }
}

async function doRegister(){
  const e=$('#f-email').value.trim(), p=$('#f-pass').value;
  if(!e||p.length<8){ $('#login-err').textContent='Email + пароль ≥ 8 символов'; return; }
  const n=prompt('Ваше имя:'); if(!n) return;
  try { const r=await API.register(e,p,n); API.setToken(r.token); USER=r.user; enterApp(); }
  catch(err){ $('#login-err').textContent=err.message; }
}

function doLogout(){ if(!confirm('Выйти?')) return; API.setToken(null); showLogin(); }
function showLogin(){ $('#login').style.display='flex'; $('#app').classList.remove('on'); }

async function enterApp(){
  $('#login').style.display='none'; $('#app').classList.add('on');
  $('#u-name').textContent=USER.name; $('#u-role').textContent=USER.role;
  $('#u-av').textContent=initials(USER.name); VIEW='dashboard'; await render();
}

document.querySelectorAll('.nav-item').forEach(n=>n.addEventListener('click',()=>{
  document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));
  n.classList.add('active'); VIEW=n.dataset.view; render();
}));

async function render(){
 const titles={dashboard:'Дашборд',shipments:'Партии',tasks:'Задачи',chat:'Чат',planner:'Планировщик маршрутов',maritime:'Морской транспорт'};
  $('#pg-title').textContent=titles[VIEW]||'Дашборд';
  try{
    if(VIEW==='dashboard') await renderDashboard();
    else if(VIEW==='shipments') await renderShipments();
    else if(VIEW==='tasks') await renderTasks();
    else if(VIEW==='chat') await renderChat();
        else if(VIEW==='maritime') await renderMaritime();
  }catch(e){ $('#content').innerHTML=`<div class="card" style="color:var(--red)">Ошибка: ${esc(e.message)}</div>`; }
}
async function reload(){ await render(); toast('Обновлено','g'); }

async function renderDashboard(){
  const [ships,tasks,act]=await Promise.all([API.shipments(),API.tasks(),API.activity()]);
  const tv=ships.reduce((s,x)=>s+ +x.volume,0);
  const inT=ships.filter(s=>['В пути','В море','В порту'].includes(s.status)).length;
  const done=ships.filter(s=>s.status==='Доставлено').length;
  const act2=tasks.filter(t=>t.status!=='done').length;
  $('#content').innerHTML=`
    <div class="kpis">
      <div class="kpi b"><div class="lbl">Общий объём</div><div class="val">${fmt(tv)} т</div></div>
      <div class="kpi p"><div class="lbl">В процессе</div><div class="val">${inT}</div></div>
      <div class="kpi g"><div class="lbl">Доставлено</div><div class="val">${done}</div></div>
      <div class="kpi"><div class="lbl">Задач активно</div><div class="val">${act2}</div></div>
    </div>
    <div class="card"><div class="card-head"><h3>Последние партии</h3></div>
    <table class="tbl"><thead><tr><th>ID</th><th>Название</th><th class="t-right">Объём</th><th>Статус</th></tr></thead>
    <tbody>${ships.slice(0,5).map(s=>`<tr><td style="color:var(--muted);font-family:monospace">${esc(s.id)}</td>
    <td><b>${esc(s.name)}</b></td><td class="t-right">${fmt(s.volume)} т</td>
    <td>${statusTag(s.status)}</td></tr>`).join('')}</tbody></table></div>
    <div class="card"><div class="card-head"><h3>Активность</h3></div>
    ${act.length?act.slice(0,8).map(a=>`<div style="display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)">
    <span>${a.icon||'•'}</span><span style="flex:1;color:var(--muted)">${a.text||''}</span>
    <span style="font-size:11px;color:var(--muted)">${fmtDT(a.created_at)}</span></div>`).join('')
    :'<div style="color:var(--muted)">Нет активности</div>'}</div>`;
}

async function renderShipments(){
  const ships=await API.shipments(FILTER);
  const statuses=['all','Закупка','Погрузка','В пути','В порту','В море','Доставлено'];
  $('#content').innerHTML=`
    <div class="card">
      <div class="card-head">
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${statuses.map(s=>`<span class="tag ${FILTER===s?'amber':'gray'}" style="cursor:pointer;padding:6px 12px" onclick="setFilter('${s}')">${s==='all'?'Все':s}</span>`).join('')}
        </div>
        <button class="btn btn-primary" onclick="modalNewShipment()">＋ Новая партия</button>
      </div>
      ${ships.length?`<table class="tbl"><thead><tr><th>ID</th><th>Название</th><th>Маршрут</th>
      <th class="t-right">Объём</th><th>Статус</th><th class="t-right">Прогресс</th></tr></thead>
      <tbody>${ships.map(s=>`<tr><td style="color:var(--muted);font-family:monospace">${esc(s.id)}</td>
      <td><b>${esc(s.name)}</b></td><td style="color:var(--muted)">${esc(s.route||'')}</td>
      <td class="t-right">${fmt(s.volume)} т</td><td>${statusTag(s.status)}</td>
      <td class="t-right">${s.progress}%</td></tr>`).join('')}</tbody></table>`
      :'<div style="text-align:center;color:var(--muted);padding:40px">Нет партий</div>'}
    </div>`;
}
function setFilter(f){ FILTER=f; render(); }

async function renderTasks(){
  const tasks=await API.tasks();
  const cols=[{k:'todo',t:'К выполнению'},{k:'progress',t:'В работе'},{k:'done',t:'Готово'}];
  $('#content').innerHTML=`
    <div class="card-head"><div></div><button class="btn btn-primary" onclick="modalNewTask()">＋ Новая задача</button></div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">
      ${cols.map(c=>{const items=tasks.filter(t=>t.status===c.k);return `<div class="card" style="margin:0">
      <div class="card-head"><h3>${c.t} · ${items.length}</h3></div>
      ${items.length?items.map(t=>`<div style="background:var(--panel2);border:1px solid var(--line);
      border-radius:10px;padding:12px;margin-bottom:10px">
      <div style="font-weight:700;margin-bottom:6px">${esc(t.title)}</div>
      <div style="font-size:11px;color:var(--muted)">${esc(t.priority)} · ${t.due_date?fmtDT(t.due_date):'—'}</div>
      <div style="display:flex;gap:6px;margin-top:8px">
      <button class="btn btn-ghost" style="padding:4px 10px;font-size:11px" onclick="setTaskStatus(${t.id},'todo')">todo</button>
      <button class="btn btn-ghost" style="padding:4px 10px;font-size:11px" onclick="setTaskStatus(${t.id},'progress')">work</button>
      <button class="btn btn-ghost" style="padding:4px 10px;font-size:11px" onclick="setTaskStatus(${t.id},'done')">done</button>
      </div></div>`).join(''):'<div style="color:var(--muted);font-size:12px;text-align:center;padding:14px">Пусто</div>'}
      </div>`;}).join('')}
    </div>`;
}

async function setTaskStatus(id,st){
  try { await API.updateTask(id,{status:st}); await render(); toast('Обновлено','g'); }
  catch(e){ toast(e.message,'r'); }
}

async function renderChat(){
  const channels=[{id:'general',n:'general'},{id:'port',n:'port-murmansk'},{id:'transport',n:'transport'}];
  const msgs=await API.chat(CHANNEL);
  $('#content').innerHTML=`
    <div class="chat">
      <div class="channels">
        <div style="font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-bottom:10px">Каналы</div>
        ${channels.map(c=>`<div class="chan ${CHANNEL===c.id?'active':''}" onclick="setChannel('${c.id}')"># ${c.n}</div>`).join('')}
      </div>
      <div class="chat-main">
        <div class="chat-head"># ${channels.find(c=>c.id===CHANNEL).n}</div>
        <div class="chat-body" id="chat-body">
          ${msgs.length?msgs.map(m=>{const own=m.user_id===USER.id;return `<div class="msg ${own?'own':''}">
          <div class="av">${initials(m.user_name||'?')}</div>
          <div><div class="meta">${esc(m.user_name||'—')} · ${fmtDT(m.created_at)}</div>
          <div class="bubble">${esc(m.text)}</div></div></div>`;}).join('')
          :'<div style="color:var(--muted);text-align:center;padding:40px">Нет сообщений</div>'}
        </div>
        <div class="chat-input">
          <input id="chat-msg" placeholder="Написать..." onkeydown="if(event.key==='Enter')sendMsg()">
          <button class="btn btn-primary" onclick="sendMsg()">Отправить</button>
        </div>
      </div>
    </div>`;
  setTimeout(()=>{const b=$('#chat-body'); if(b) b.scrollTop=b.scrollHeight; $('#chat-msg')?.focus();},50);
}
function setChannel(c){ CHANNEL=c; render(); }
async function sendMsg(){
  const inp=$('#chat-msg'); const t=inp.value.trim(); if(!t) return;
  try { await API.sendMsg(CHANNEL,t); inp.value=''; await renderChat(); }
  catch(e){ toast(e.message,'r'); }
}

function closeModal(){ $('#modal').classList.remove('on'); }

function modalNewShipment(){
  $('#m-title').textContent='Новая партия';
  $('#m-body').innerHTML=`
    <div class="field"><label>Название</label><input id="sh-name" placeholder="Партия №006 · 25 000 т"></div>
    <div class="field"><label>Объём (тонн)</label><input id="sh-vol" type="number" value="20000"></div>
    <div class="field"><label>Контейнеров</label><input id="sh-cont" type="number" value="1000"></div>
    <div class="field"><label>Маршрут</label><input id="sh-route" value="Воронеж → Мурманск → Турция"></div>`;
  $('#m-foot').innerHTML=`<button class="btn btn-ghost" onclick="closeModal()">Отмена</button>
  <button class="btn btn-primary" onclick="saveShipment()">Создать</button>`;
  $('#modal').classList.add('on');
}

async function saveShipment(){
  const d={name:$('#sh-name').value.trim(),volume:parseInt($('#sh-vol').value)||0,
    container_count:parseInt($('#sh-cont').value)||0,route:$('#sh-route').value.trim()};
  if(!d.name){ toast('Введите название','r'); return; }
  try { await API.createShipment(d); closeModal(); await render(); toast('Партия создана','g'); }
  catch(e){ toast(e.message,'r'); }
}

function modalNewTask(){
  $('#m-title').textContent='Новая задача';
  $('#m-body').innerHTML=`
    <div class="field"><label>Название</label><input id="t-title"></div>
    <div class="field"><label>Описание</label><textarea id="t-desc"></textarea></div>
    <div class="field"><label>Приоритет</label>
    <select id="t-priority"><option value="high">Высокий</option><option value="medium" selected>Средний</option><option value="low">Низкий</option></select></div>
    <div class="field"><label>Срок</label><input id="t-due" type="date"></div>`;
  $('#m-foot').innerHTML=`<button class="btn btn-ghost" onclick="closeModal()">Отмена</button>
  <button class="btn btn-primary" onclick="saveTask()">Создать</button>`;
  $('#modal').classList.add('on');
}

async function saveTask(){
  const d={title:$('#t-title').value.trim(),description:$('#t-desc').value.trim(),
    priority:$('#t-priority').value,due_date:$('#t-due').value||null};
  if(!d.title){ toast('Введите название','r'); return; }
  try { await API.createTask(d); closeModal(); await render(); toast('Задача создана','g'); }
  catch(e){ toast(e.message,'r'); }
}

(async function init(){
  if (API.token) {
    try { USER=await API.me(); await enterApp(); return; }
    catch { API.setToken(null); }
  }
  showLogin();
})();
